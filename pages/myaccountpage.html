<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account</title>
    <link rel="stylesheet" href="../styles/myaccount.css">
    <link rel="stylesheet" href="../styles/modals.css">
</head>
<body>
    <div id="container">
        <div id="sidebar">
            <div class="nav-links">
                <a class="nav-item" href="../pages/explorepage.html">Explore page</a>
                <a class="nav-item" href="../pages/myorder.html">My Orders</a>
                <a class="nav-item" href="../pages/bookListing.html">Book listing</a>
            </div>
            <div class="nav-item">My account</div>
        </div>

        <div id="content">
            <div id="account-card">
                <button id="edit-btn">edit</button>
                <div id="profile-pic">
                    <img src="../images/Profile.jpg" alt="Profile" width="150" height="150">
                </div>
                <div id="details">
                    <h1>Username</h1>
                    <h3 id="username">examplename</h3>
                    <h2>Email</h2>
                    <h3>email@example.com</h3>
                    <div id="actions">
                        <button onclick="window.location.href='login.html'">Logout</button>
                        <button>Delete</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ── EDIT PROFILE MODAL ─────────────────── -->
    <div id="profile-backdrop" class="modal-backdrop"></div>
    <div id="profile-modal" class="modal-box">
        <h3>Edit Profile</h3>

        <div class="form-group">
            <label for="edit-username">Username</label>
            <input type="text" id="edit-username" placeholder="Your name">
        </div>
        <div class="form-group">
            <label for="edit-image">Profile Image</label>
            <input type="file" id="edit-image" accept="image/*">
            <img id="edit-img-preview" class="modal-img-preview" src="" alt="Preview">
        </div>

        <div class="modal-actions">
            <button id="profile-modal-close" class="modal-btn-cancel">Cancel</button>
            <button id="profile-save"        class="modal-btn-save">Save</button>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../js/myaccount.js"></script>
</body>
</html>

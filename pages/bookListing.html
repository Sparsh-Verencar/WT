<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Listing</title>
    <link rel="stylesheet" href="../styles/bookListing.css">
    <link rel="stylesheet" href="../styles/modals.css">
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-links">
            <a href="../pages/explorepage.html">Explore page</a>
            <a href="../pages/myorder.html">My Orders</a>
            <a href="#">Book listing</a>
        </div>
        <a href="../pages/myaccountpage.html">My account</a>
    </div>

    <div class="main">
        <div class="top-bar">
            <h2>Book listings</h2>
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="🔍  Search">
            </div>
        </div>

        <div class="book-grid">
            <div class="add-card">
                <p>+</p>
            </div>
            <!-- book cards injected here by JS -->
        </div>
    </div>

    <!-- ── ADD / EDIT MODAL ──────────────────── -->
    <div id="modal-backdrop" class="modal-backdrop"></div>
    <div id="book-modal" class="modal-box">
        <h3 id="modal-title">Add Book</h3>

        <div class="form-group">
            <label for="input-name">Book Name</label>
            <input type="text" id="input-name" placeholder="e.g. 1984">
        </div>
        <div class="form-group">
            <label for="input-desc">Description</label>
            <textarea id="input-desc" placeholder="Short description…"></textarea>
        </div>
        <div class="form-group">
            <label for="input-price">Price</label>
            <input type="text" id="input-price" placeholder="e.g. $9.99">
        </div>
        <div class="form-group">
            <label for="input-image">Book Image</label>
            <input type="file" id="input-image" accept="image/*">
            <img id="modal-img-preview" class="modal-img-preview" src="" alt="Preview">
        </div>

        <div class="modal-actions">
            <button id="modal-close" class="modal-btn-cancel">Cancel</button>
            <button id="modal-save"  class="modal-btn-save">Save</button>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../js/bookListing.js"></script>
</body>
</html>
